<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <title>Analytics - Attention Extension</title>
  <style>
    body {
      padding: 20px;
      margin: 0 auto;
      max-width: 1000px;
      min-height: 100vh;
      width: 100%;
    }

    .header-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .metrics-panel {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
    }

    .metric-card {
      flex: 1;
      background: var(--surface-color);
      padding: 15px;
      border-radius: var(--card-radius);
      border: 1px solid var(--border-color);
      text-align: center;
    }

    .metric-title {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .metric-value {
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--text-main);
    }

    .charts-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .chart-box {
      background: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: var(--card-radius);
      padding: 15px;
      height: 250px;
      display: flex;
      flex-direction: column;
    }

    .chart-wrapper {
      flex: 1;
      position: relative;
      min-height: 0;
      width: 100%;
    }

    h2 {
      font-size: 1rem;
      margin-bottom: 10px;
      color: var(--text-main);
    }

    /* Responsiveness */
    @media (max-width: 768px) {
      .header-actions {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
      }

      .metrics-panel {
        flex-direction: column;
      }

      .charts-grid {
        grid-template-columns: 1fr;
      }

      .chart-box {
        height: 300px;
      }
    }

  </style>
</head>

<body>
  <div class="container" style="max-width: 100%;">
    <header class="header-actions">
      <div>
        <h1>Deep Analytics</h1>
        <a href="popup.html" style="color:var(--primary); text-decoration:none;">← Back</a>
      </div>
      <div style="display: flex; gap: 10px;">
        <button id="downloadBtn" class="btn">Download Report</button>
        <button id="clearBtn" class="btn"
          style="color:#ef4444; border-color: rgba(239,68,68,0.3); background: rgba(239,68,68,0.1);">Clear
          History</button>
      </div>
    </header>

    <div class="metrics-panel">
      <div class="metric-card">
        <div class="metric-title">Avg Session Duration</div>
        <div class="metric-value" id="avgSession">--</div>
      </div>
      <div class="metric-card">
        <div class="metric-title">Peak Distraction Hour</div>
        <div class="metric-value" id="peakHour">--</div>
      </div>
      <div class="metric-card">
        <div class="metric-title">Most Active Time</div>
        <div class="metric-value" id="activeTime">--</div>
      </div>
    </div>

    <div class="charts-grid">
      <div class="chart-box">
        <h2>Tab Switching Over Time</h2>
        <div class="chart-wrapper"><canvas id="chart1"></canvas></div>
      </div>
      <div class="chart-box">
        <h2>Daily Overload Trend</h2>
        <div class="chart-wrapper"><canvas id="chart2"></canvas></div>
      </div>
      <div class="chart-box">
        <h2>Hourly Activity Chart</h2>
        <div class="chart-wrapper"><canvas id="chart3"></canvas></div>
      </div>
      <div class="chart-box">
        <h2>Multitasking Intensity</h2>
        <div class="chart-wrapper"><canvas id="chart4"></canvas></div>
      </div>
      <div class="chart-box" style="grid-column: 1 / -1;">
        <h2>Session Duration Distribution</h2>
        <div class="chart-wrapper"><canvas id="chart5"></canvas></div>
      </div>
    </div>
  </div>

  <script src="chart.js"></script>
  <script src="analytics.js"></script>
</body>

</html>
