<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Weekly Attention Report</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100% !important;
      min-height: 100vh;
      background: #E9BCB9; /* Lightest peach */
      color: #1B1931; /* Deep Plum */
      font-family: 'Outfit', sans-serif;
      overflow-x: hidden;
    }
    .report-container {
      max-width: 1400px;
      width: 90%;
      margin: 40px auto;
      padding: 40px;
      background: rgba(255, 255, 255, 0.7); /* Frosted white */
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 20px;
      backdrop-filter: blur(20px);
      box-shadow: 0 25px 50px -12px rgba(27, 25, 49, 0.2);
    }
    .header {
      text-align: center;
      margin-bottom: 40px;
    }
    .header h1 {
      font-size: 2.8rem;
      margin: 0 0 10px 0;
      background: linear-gradient(135deg, #1B1931, #44174E);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header p {
      color: #44174E; /* Deep Berry */
      font-size: 1.2rem;
      margin: 0;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 40px;
    }
    .stat-card {
      background: rgba(255, 255, 255, 0.5);
      padding: 30px 20px;
      border-radius: 16px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.8);
    }
    .stat-card h3 {
      font-size: 1rem;
      color: #44174E;
      margin: 0 0 15px 0;
      font-weight: 500;
    }
    .stat-card .value {
      font-size: 2.5rem;
      font-weight: 700;
      color: #1B1931;
    }
    .stat-card .trend {
      font-size: 0.9rem;
      margin-top: 10px;
      font-weight: 500;
    }
    .trend.good { color: #A34054; }
    .trend.bad { color: #ED9E59; }
    .chart-box {
      background: rgba(255, 255, 255, 0.5);
      padding: 30px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      margin-bottom: 40px;
      overflow: hidden; /* Prevent chart overflow */
    }
    .chart-box h2 {
      margin: 0 0 20px 0;
      font-size: 1.5rem;
      font-weight: 500;
    }
    .insights {
      background: rgba(163, 64, 84, 0.15); /* Rose accent background */
      border: 1px solid rgba(163, 64, 84, 0.4);
      padding: 25px;
      border-radius: 16px;
    }
    .insights h2 {
      color: #662249;
      margin: 0 0 15px 0;
      font-size: 1.4rem;
    }
    .insights ul {
      margin: 0;
      padding-left: 20px;
      color: #44174E;
      line-height: 1.8;
      font-size: 1.1rem;
    }

    /* Responsiveness */
    @media (max-width: 1024px) {
      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 768px) {
      .report-container {
        width: 95%;
        padding: 24px;
        margin: 20px auto;
      }

      .header h1 {
        font-size: 2rem;
      }

      .stats-grid {
        grid-template-columns: 1fr;
      }

      .stat-card .value {
        font-size: 2rem;
      }

      .charts-row {
        grid-template-columns: 1fr !important;
      }

      .chart-box {
        padding: 20px;
      }
    }

  </style>
</head>
<body>

  <div class="report-container">
    <div class="header">
      <h1>Weekly Attention Report</h1>
      <p id="dateRangeText">Analyzing your last 7 days of browsing activity</p>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <h3>Total Tab Switches</h3>
        <div class="value" id="valSwitches">--</div>
        <div class="trend" id="trendSwitches">--</div>
      </div>
      <div class="stat-card">
        <h3>Active Browser Time</h3>
        <div class="value" id="valTime">--</div>
        <div class="trend" id="trendTime">--</div>
      </div>
      <div class="stat-card">
        <h3>Information Load Score</h3>
        <div class="value" id="valScore">--</div>
        <div class="trend" id="trendScore">--</div>
      </div>
    </div>

    <div class="chart-box" style="margin-bottom: 20px;">
      <h2>Activity Trend Over Last 7 Days</h2>
      <div style="height: 300px; position: relative;">
        <canvas id="weeklyChart"></canvas>
      </div>
    </div>

    <div class="charts-row" style="display: grid; grid-template-columns: 1fr 2fr; gap: 20px; margin-bottom: 40px;">
      <div class="chart-box" style="margin-bottom: 0;">
        <h2>Distraction Breakdown</h2>
        <div style="height: 250px; position: relative;">
          <canvas id="breakdownChart"></canvas>
        </div>
      </div>
      <div class="chart-box" style="margin-bottom: 0;">
        <h2>Hourly Focus Map</h2>
        <div style="height: 250px; position: relative;">
          <canvas id="hourlyChart"></canvas>
        </div>
      </div>
    </div>

    <div class="insights">
      <h2>Key Takeaways</h2>
      <ul id="insightList">
        <li>Generating your personalized insights...</li>
      </ul>
    </div>
  </div>

  <script src="chart.js"></script>
  <script src="weekly_report.js"></script>
</body>
</html>
