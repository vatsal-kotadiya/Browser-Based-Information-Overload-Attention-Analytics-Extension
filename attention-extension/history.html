<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <title>History - Attention Extension</title>
  <style>
    body {
      width: 600px;
      min-height: 400px;
    }

    .table-container {
      background: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: var(--card-radius);
      padding: 15px;
      margin-top: 15px;
      overflow-y: auto;
      max-height: 300px;
    }

    .filters {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }
  </style>
</head>

<body>
  <div class="container">
    <header>
      <h1>Activity History</h1>
      <a href="popup.html" style="color:var(--primary); text-decoration:none;">← Back</a>
    </header>

    <div class="filters">
      <button id="btnDaily" class="btn primary">Daily</button>
      <button id="btnWeekly" class="btn">Weekly</button>
      <button id="btnMonthly" class="btn">Monthly</button>
    </div>

    <div class="table-container">
      <table id="historyTable" style="width: 100%; border-collapse: collapse; text-align: left;">
        <thead>
          <tr style="border-bottom: 1px solid var(--border-color);">
            <th style="padding: 8px; color: var(--text-muted);">Date</th>
            <th style="padding: 8px; color: var(--text-muted);">ILS Score</th>
            <th style="padding: 8px; color: var(--text-muted);">AFI Index</th>
            <th style="padding: 8px; color: var(--text-muted);">Tab Switches</th>
            <th style="padding: 8px; color: var(--text-muted);">Notifications</th>
          </tr>
        </thead>
        <tbody>
          <!-- Populated via JS -->
        </tbody>
      </table>
    </div>
  </div>

  <script src="history.js"></script>
</body>

</html>
